name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly: live advisory data changes without code changes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node --check skills/vuln-check/scripts/scan.mjs && node --check install.mjs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/scan.test.mjs
        env:
          VG_ONLINE: "1"
      - name: Installer round trip
        shell: bash
        run: |
          node install.mjs --target ci-skills
          test -f ci-skills/vuln-check/scripts/scan.mjs
          test -f ci-skills/vuln-fix/SKILL.md
          node install.mjs --target ci-skills --uninstall
          test ! -e ci-skills/vuln-check
