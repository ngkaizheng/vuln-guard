name: Bug
description: The scanner crashed, a skill did the wrong thing, or the install failed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "vuln-guard 1.1.0 · Node 22.19 · Windows 11 · Claude Code 2.1.300 (or Copilot / Codex / CLI only)"
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: Output or agent transcript
      render: text
